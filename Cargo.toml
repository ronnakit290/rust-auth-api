[package]
name = "rust-auth-api"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Production-shaped authentication & user management API written in Rust (Axum + SQLx + JWT)"
license = "MIT"

[dependencies]
# web
axum = { version = "0.8", features = ["form", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "request-id", "compression-gzip", "limit", "timeout", "set-header"] }
tokio = { version = "1", features = ["full"] }

# data
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# security
argon2 = "0.5"
jsonwebtoken = "9"
sha2 = "0.10"
rand = "0.8"
hex = "0.4"
totp-rs = { version = "5.7", features = ["gen_secret", "otpauth"] }

# platform
thiserror = "2"
anyhow = "1"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
validator = { version = "0.20", features = ["derive"] }

# docs
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid", "macros"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
rsa = { version = "0.9.10", features = ["pem"] }
base64 = "0.23.1"

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
